# Пример конфигурации Nginx для приложения «База знаний и ПТО».
# Замените infoteh.example.ru на свой домен.
# Установка: cp deploy/nginx.conf /etc/nginx/sites-available/infoteh

upstream infoteh_app {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name infoteh.example.ru;

    # ACME-проверка Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name infoteh.example.ru;

    # Пути выдаст certbot после выпуска сертификата
    ssl_certificate     /etc/letsencrypt/live/infoteh.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infoteh.example.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Приложение уже отдаёт CSP и прочие заголовки; здесь — только транспортные.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 25m;      # документы до 20 МБ + запас на multipart
    client_body_timeout 60s;
    proxy_read_timeout 120s;

    access_log /var/log/nginx/infoteh.access.log;
    error_log  /var/log/nginx/infoteh.error.log;

    location / {
        proxy_pass http://infoteh_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Служебные endpoint'ы не индексируются
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
